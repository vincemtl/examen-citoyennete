e?","choices":["100 000 habitants","1 million d'habitants","10 000 habitants","500 000 habitants"],"answer":0,"page":50},{"id":558,"type":"mc","section":"Régions du Canada","question":"Comment appelle-t-on souvent le Nord canadien?","choices":["La terre du soleil de minuit","La terre des glaces éternelles","Le grenier du monde","La porte de l'Ouest"],"answer":0,"page":50},{"id":559,"type":"mc","section":"Régions du Canada","question":"Qu'est-ce que la toundra?","choices":["Une vaste plaine arctique rocailleuse sans arbres au sol gelé","Une forêt dense de conifères","Une prairie fertile","Une chaîne de montagnes"],"answer":0,"page":50},{"id":560,"type":"mc","section":"Régions du Canada","question":"Quel poète a célébré les mineurs de la ruée vers l'or du Yukon?","choices":["Robert W. Service","John McCrae","Émile Nelligan","Pauline Johnson"],"answer":0,"page":50},{"id":561,"type":"mc","section":"Régions du Canada","question":"Dans les années 1890, quel événement a attiré des milliers de mineurs au Yukon?","choices":["La ruée vers l'or","La découverte de diamants","La construction du chemin de fer","La découverte de pétrole"],"answer":0,"page":50},{"id":562,"type":"mc","section":"Régions du Canada","question":"Quelle est la température la plus froide jamais enregistrée au Canada, au Yukon?","choices":["-63 °C","-45 °C","-52 °C","-75 °C"],"answer":0,"page":50},{"id":563,"type":"mc","section":"Régions du Canada","question":"Quelle est la plus haute montagne du Canada?","choices":["Le mont Logan","Le mont Robson","Le mont Columbia","Le mont Tremblant"],"answer":0,"page":50},{"id":564,"type":"mc","section":"Régions du Canada","question":"Comment surnomme-t-on Yellowknife?","choices":["La capitale nord-américaine du diamant","La capitale de l'or","La porte du Nord","La ville du soleil de minuit"],"answer":0,"page":50},{"id":565,"type":"mc","section":"Régions du Canada","question":"Quel est le fleuve le plus long du Canada, surpassé en Amérique du Nord seulement par le Miss e avec des hivers doux.","choices":["Vrai","Faux"],"answer":1,"page":48},{"id":575,"type":"tf","section":"Régions du Canada","question":"Halifax est le plus grand port de la côte Est du Canada.","choices":["Vrai","Faux"],"answer":0,"page":46},{"id":576,"type":"tf","section":"Régions du Canada","question":"Saint John est la capitale du Nouveau-Brunswick.","choices":["Vrai","Faux"],"answer":1,"page":45},{"id":577,"type":"tf","section":"Régions du Canada","question":"Le Québec est la province la plus peuplée du Canada.","choices":["Vrai","Faux"],"answer":1,"page":48},{"id":578,"type":"tf","section":"Régions du Canada","question":"L'Ontario a été fondé par les loyalistes de l'Empire-Uni.","choices":["Vrai","Faux"],"answer":0,"page":48},{"id":579,"type":"tf","section":"Régions du Canada","question":"Calgary est la capitale de l'Alberta.","choices":["Vrai","Faux"],"answer":1,"page":45},{"id":580,"type":"tf","section":"Régions du Canada","question":"Le Manitoba est une importante plaque tournante de la culture ukrainienne.","choices":["Vrai","Faux"],"answer":0,"page":48},{"id":581,"type":"tf","section":"Régions du Canada","question":"La Colombie-Britannique possède le plus vaste réseau de parcs provinciaux au Canada.","choices":["Vrai","Faux"],"answer":0,"page":49},{"id":582,"type":"tf","section":"Régions du Canada","question":"Au Nunavut, l'inuktitut est une langue officielle.","choices":["Vrai","Faux"],"answer":0,"page":51},{"id":583,"type":"tf","section":"Régions du Canada","question":"Dans le Nord, en hiver, l'obscurité peut régner pendant trois mois.","choices":["Vrai","Faux"],"answer":0,"page":50},{"id":584,"type":"tf","section":"Régions du Canada","question":"Le lac Louise se trouve dans les montagnes Rocheuses.","choices":["Vrai","Faux"],"answer":0,"page":49},{"id":585,"type":"tf","section":"Régions du Canada","question":"Le chemin de fer White Pass and Yukon reliait Skagway, en Alaska, à Whitehorse.","choices":["Vrai","Faux"],"answer":0,"page":50}]</script>
<script>
"use strict";
const QUESTION_COUNT = 20, DURATION_MS = 45 * 60 * 1000, PASS_MARK = 15;
const K_RESULTS = "cq_results", K_CURRENT = "cq_current";
const POOL = JSON.parse(document.getElementById("questions").textContent);
const $screen = document.getElementById("screen");

// ---------- storage (localStorage; may be unavailable in private mode) ----------
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }
function remove(key) { try { localStorage.removeItem(key); } catch (e) {} }
const loadResults = () => { const r = load(K_RESULTS, []); return Array.isArray(r) ? r : []; };

// ---------- helpers ----------
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pad2 = n => String(n).padStart(2, "0");
function fmtDate(ms) {
  const d = new Date(ms), m = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}, ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
const fmtDur = s => `${Math.floor(s / 60)} min ${pad2(s % 60)} s`;
const score = items => items.filter(it => it.chosen === it.correct).length;

function setScreen(title, html, barAction) {
  document.getElementById("title").textContent = title;
  const act = document.getElementById("baract");
  act.innerHTML = "";
  if (barAction) { const b = document.createElement("button"); b.textContent = barAction[0]; b.onclick = barAction[1]; act.appendChild(b); }
  $screen.innerHTML = html;
  const m = $screen.querySelector("main"); if (m) m.scrollTop = 0;
}

function dialog(title, msg, okLabel, cancelLabel) {
  return new Promise(res => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="acts">
      ${cancelLabel ? `<button class="btn" data-v="0">${esc(cancelLabel)}</button>` : ""}
      <button class="btn primary" data-v="1">${esc(okLabel)}</button></div></div>`;
    m.addEventListener("click", e => { const v = e.target.dataset && e.target.dataset.v; if (v !== undefined) { m.remove(); res(v === "1"); } });
    document.body.appendChild(m);
  });
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}

// ---------- home ----------
function showHome() {
  stopTimer();
  const n = loadResults().length;
  setScreen("Examen Citoyenneté", `<main><div class="col">
    <p class="title center">Examen pour la citoyenneté canadienne</p>
    <p class="center" style="margin:8px 0 0">Examen de pratique basé sur le guide « Découvrir le Canada »</p>
    <div class="box" style="margin-top:24px"><ul>
      <li>${QUESTION_COUNT} questions choisies au hasard</li><li>Durée : 45 minutes</li>
      <li>Choix multiple (4 réponses) ou vrai/faux</li><li>Note de passage : ${PASS_MARK}/${QUESTION_COUNT} (75 %)</li>
      <li>Les bonnes réponses sont affichées à la fin et le résultat est enregistré</li></ul></div>
    <button class="btn primary" id="start" style="margin-top:24px">Commencer l'examen</button>
    <button class="btn" id="hist">Historique des résultats</button>
    <p class="center muted small" style="margin-top:16px">${n === 0 ? "Aucun examen complété pour l'instant."
      : n + " examen(s) complété(s). Consultez l'historique pour revoir vos réponses."}</p>
  </div></main>`);
  document.getElementById("start").onclick = startExam;
  document.getElementById("hist").onclick = showHistory;
}

// ---------- exam ----------
let exam = null, index = 0, timerId = null;

function startExam() {
  const items = shuffle(POOL.slice()).slice(0, QUESTION_COUNT).map(q => {
    let choices = q.choices.slice(), correct = q.answer;
    if (q.type === "mc") { const right = choices[correct]; shuffle(choices); correct = choices.indexOf(right); }
    return { id: q.id, section: q.section, question: q.question, choices, correct, page: q.page, chosen: -1 };
  });
  exam = { started: Date.now(), items, index: 0 };
  index = 0;
  persist();
  showQuiz();
}
function persist() { if (exam) { exam.index = index; save(K_CURRENT, exam); } }
const remaining = () => exam.started + DURATION_MS - Date.now();
const answeredCount = () => exam.items.filter(it => it.chosen >= 0).length;

function showQuiz() {
  setScreen("Examen", `
    <div class="qhead"><span id="prog"></span><span class="timer" id="timer">45:00</span></div>
    <main id="qbody"><div class="col"><div class="section" id="sec"></div><div class="question" id="q"></div><div id="choices"></div></div></main>
    <div class="foot"><div class="answered" id="answered"></div>
      <div class="nav"><button class="btn" id="prev">◀ Précédent</button><button class="btn primary" id="end">Terminer</button><button class="btn" id="next">Suivant ▶</button></div></div>`,
    ["Quitter", confirmQuit]);
  document.getElementById("prev").onclick = () => { if (index > 0) { index--; renderQuestion(); } };
  document.getElementById("next").onclick = () => { if (index < exam.items.length - 1) { index++; renderQuestion(); } };
  document.getElementById("end").onclick = confirmFinish;
  renderQuestion();
  startTimer();
}

function renderQuestion() {
  const it = exam.items[index], L = ["A", "B", "C", "D"];
  document.getElementById("prog").textContent = `Question ${index + 1} / ${exam.items.length}`;
  document.getElementById("sec").textContent = it.section;
  document.getElementById("q").textContent = it.question;
  const box = document.getElementById("choices");
  box.innerHTML = it.choices.map((c, i) =>
    `<button class="choice${i === it.chosen ? " on" : ""}" data-i="${i}" aria-pressed="${i === it.chosen}"><span class="dot"></span>${it.choices.length > 2 ? L[i] + ")&nbsp; " : ""}${esc(c)}</button>`).join("");
  box.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    it.chosen = +b.dataset.i;
    box.querySelectorAll(".choice").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
    updateAnswered(); persist();
  });
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === exam.items.length - 1;
  updateAnswered(); persist();
  document.getElementById("qbody").scrollTop = 0;
}
function updateAnswered() { document.getElementById("answered").textContent = `${answeredCount()} / ${exam.items.length} questions répondues`; }

function tick() {
  if (!exam) return;
  const rem = remaining(), t = document.getElementById("timer");
  if (rem <= 0) { if (t) t.textContent = "00:00"; toast("Le temps est écoulé!"); finishExam(true); return; }
  if (t) { const s = Math.ceil(rem / 1000); t.textContent = `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; t.classList.toggle("low", rem < 5 * 60 * 1000); }
}
function startTimer() { stopTimer(); tick(); timerId = setInterval(tick, 500); }
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && timerId) tick(); });

async function confirmFinish() {
  const missing = exam.items.length - answeredCount();
  const ok = await dialog("Terminer l'examen", missing > 0
    ? `Il vous reste ${missing} question(s) sans réponse. Les questions sans réponse seront comptées comme erronées. Terminer quand même?`
    : "Voulez-vous terminer l'examen et voir votre résultat?", "Terminer", "Continuer");
  if (ok && exam) finishExam(false);
}
async function confirmQuit() {
  const ok = await dialog("Quitter l'examen?", "Si vous quittez maintenant, l'examen sera abandonné et ne sera pas enregistré.", "Abandonner", "Continuer l'examen");
  if (ok) { exam = null; remove(K_CURRENT); showHome(); }
}

function finishExam(timeUp) {
  if (!exam) return;
  stopTimer();
  document.querySelectorAll(".modal").forEach(m => m.remove());
  const id = Date.now(), used = Math.min(id - exam.started, DURATION_MS);
  const attempt = { id, started: exam.started, finished: id, durationSec: Math.floor(used / 1000),
    score: score(exam.items), total: exam.items.length, timeUp, items: exam.items };
  const all = loadResults(); all.push(attempt);
  if (!save(K_RESULTS, all)) toast("Erreur d'enregistrement : le stockage n'est pas disponible.");
  exam = null; remove(K_CURRENT);
  showResult(attempt);
}

// ---------- result ----------
function showResult(a) {
  stopTimer();
  const pass = a.score >= PASS_MARK;
  const cards = a.items.map((it, n) => {
    const ok = it.chosen === it.correct;
    return `<div class="card ${ok ? "ok" : "ko"}"><div class="h ${ok ? "g" : "r"}">${ok ? "✔" : "✘"} Question ${n + 1}</div>
      <div class="q">${esc(it.question)}</div>
      ${ok ? "" : `<div class="a r">Votre réponse : ${it.chosen >= 0 ? esc(it.choices[it.chosen]) : "(aucune réponse)"}</div>`}
      <div class="a g" style="font-weight:700${ok ? "" : ";margin-top:2px"}">${ok ? "Votre réponse" : "Bonne réponse"} : ${esc(it.choices[it.correct])}</div>
      <div class="ref">${esc(it.section)} — guide p. ${it.page}</div></div>`;
  }).join("");
  setScreen("Résultat", `<main><div class="col">
    <div class="card sum ${pass ? "ok okbg" : "ko kobg"}" style="margin-top:0">
      <div class="st ${pass ? "g" : "r"}">${pass ? "RÉUSSI" : "ÉCHOUÉ"}</div>
      <div class="sc">${a.score} / ${a.total}  (${Math.round(100 * a.score / a.total)} %)</div>
      <div class="info">Note de passage : ${PASS_MARK}/${a.total}<br>Temps utilisé : ${fmtDur(a.durationSec)}${a.timeUp ? " (temps écoulé)" : ""}<br>${fmtDate(a.finished)}</div>
    </div>
    <h2>Correction</h2>${cards}
    <button class="btn primary" id="back" style="margin-top:16px">Retour</button></div></main>`,
    ["Accueil", showHome]);
  document.getElementById("back").onclick = showHome;
}

// ---------- history ----------
function showHistory() {
  stopTimer();
  const all = loadResults();
  let body;
  if (!all.length) body = `<p class="center" style="margin-top:24px">Aucun résultat enregistré.</p>`;
  else {
    let best = 0, sum = 0, passed = 0;
    all.forEach(a => { best = Math.max(best, a.score); sum += a.score; if (a.score >= PASS_MARK) passed++; });
    body = `<div class="box" style="font-size:15px">${all.length} examen(s) — ${passed} réussi(s)<br>
      Meilleur résultat : ${best}/${QUESTION_COUNT} &nbsp; Moyenne : ${(sum / all.length).toFixed(1).replace(".", ",")}/${QUESTION_COUNT}</div>` +
      all.slice().reverse().map(a => { const p = a.score >= PASS_MARK;
        return `<div class="card row ${p ? "ok okbg" : "ko kobg"}" data-id="${a.id}" role="button" tabindex="0">
          ${p ? "✔ RÉUSSI" : "✘ ÉCHOUÉ"}&nbsp; ${a.score}/${a.total}<br>${fmtDate(a.finished)} · ${fmtDur(a.durationSec)}</div>`; }).join("") +
      `<button class="btn" id="clear" style="margin-top:20px">Effacer l'historique</button>`;
  }
  setScreen("Historique des résultats", `<main><div class="col">${body}
    <h2 style="font-size:16px">Sauvegarde</h2>
    <p class="muted small" style="margin:4px 0 0">Les résultats sont enregistrés dans ce navigateur seulement. Exportez-les pour les conserver ou les transférer sur un autre appareil.</p>
    <button class="btn" id="exp">Exporter les résultats</button>
    <button class="btn" id="imp">Importer des résultats</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button class="btn primary" id="back" style="margin-top:16px">Retour</button></div></main>`, ["Accueil", showHome]);
  $screen.querySelectorAll(".row").forEach(r => r.onclick = () => {
    const a = loadResults().find(x => String(x.id) === r.dataset.id); if (a) showResult(a);
  });
  const clear = document.getElementById("clear");
  if (clear) clear.onclick = async () => {
    if (await dialog("Effacer l'historique", "Tous les résultats enregistrés seront supprimés. Continuer?", "Effacer", "Annuler")) { remove(K_RESULTS); showHistory(); }
  };
  document.getElementById("back").onclick = showHome;
  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(loadResults())], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `resultats-citoyennete-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  const file = document.getElementById("file");
  document.getElementById("imp").onclick = () => file.click();
  file.onchange = async () => {
    try {
      const data = JSON.parse(await file.files[0].text());
      if (!Array.isArray(data) || data.some(a => !a || typeof a.id !== "number" || !Array.isArray(a.items))) throw new Error("format");
      const all = loadResults(), ids = new Set(all.map(a => a.id));
      const added = data.filter(a => !ids.has(a.id));
      all.push(...added); all.sort((x, y) => x.id - y.id);
      if (!save(K_RESULTS, all)) throw new Error("stockage");
      toast(`${added.length} résultat(s) importé(s).`); showHistory();
    } catch (e) { toast("Fichier invalide : impossible d'importer."); }
  };
}

// ---------- start ----------
(function init() {
  const cur = load(K_CURRENT, null);
  if (cur && Array.isArray(cur.items) && typeof cur.started === "number") {
    exam = cur; index = Math.min(cur.index || 0, cur.items.length - 1);
    if (remaining() <= 0) { finishExam(true); return; }
    showQuiz(); toast("Examen en cours repris.");
    return;
  }
  showHome();
})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
